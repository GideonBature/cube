[package]
name = "cube-argo"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Vendored from the revision recorded in docs/implementation.md section 2, with the
# preprocessing-cache patch described in vendor/argo/PATCHES.md. A pinned git dependency cannot be
# patched, and the patch is what keeps two verifier keys in one process from sharing precomputation.
argo = { path = "../../vendor/argo" }

# Argo declares `blake3 = "1.8.2"` with `traits-preview`, and ark-ff 0.5 needs
# `blake3::Hasher: FixedOutputReset`. That bound no longer holds in blake3 1.8.7, so a fresh
# lockfile fails to build Argo. The version is held here instead of forking.
blake3 = { version = "=1.8.2", features = ["traits-preview"] }

# Same major version Argo uses, so the canonical byte form is the same type family.
ark-bn254 = "0.5.0"
# The key conversion evaluates pairings itself; Argo keeps its equation private.
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["getrandom"] }
sha2 = "0.10"
