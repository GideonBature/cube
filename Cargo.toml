[workspace]
members = ["crates/cube-argo", "crates/cube-proof"]
# `vendor/argo` is a pinned, locally patched copy of upstream Argo. It is a path dependency, not a
# member: keeping it out of the workspace keeps upstream code out of `cargo fmt --all` and clippy.
exclude = ["vendor/argo"]

# Lint levels live on the workspace so member crates can inherit them with `[lints] workspace = true`.
# This also avoids a false positive in Even Better TOML, which cannot resolve the lint sub-schemas
# when they are reached through the `anyOf` that guards a package-level `[lints]` table.
[workspace.lints.clippy]
module_inception = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
wrong_self_convention = "allow"
large_enum_variant = "allow"
manual_div_ceil = "allow"
assign_op_pattern = "allow"
manual_async_fn = "allow"

[package]
name = "cube"
version = "0.1.2"
authors = ["Brock Aegean <brock@bits.app>"]
edition = "2021"

# Inherit the lint levels configured under `[workspace.lints]`.
[lints]
workspace = true

[dependencies]
axum = "0.7.9"
async-trait = "0.1.83"
bech32 = "0.11.0"
bit-vec = "0.8.0"
bitcoin = "0.32.5"
bitcoincore-rpc = "0.19.0"
blake2 = "0.10.6"
bls_on_arkworks = "0.3.0"
chrono = "0.4.39"
colored = "2.2.0"
easy-upnp = "0.2.0"
futures = "0.3.31"
hex = "0.4.3"
libc = "0.2.178"
nostr-sdk = "0.37.0"
rand = "0.8.5"
reqwest = "0.12.9"
secp = { version = "0.4.1", default-features = false, features = ["k256", "serde"] }
serde = "1.0.216"
serde_json = "1.0.134"
sha2 = "0.10.8"
sled = "0.34.7"
tokio = { version = "1.40.0", features = ["full"] }
uint = { version = "0.9", default-features = false }
zeroize = "1.8.2"
bincode = { version = "2", features = ["serde"] }

# Node-backed proof integration tests cross the application/Argo boundary through bytes. These
# crates use arkworks 0.5, a separate tree from the application's 0.4.2 dependency; no type is
# shared across the boundary.
[dev-dependencies]
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-std = { version = "0.5.0", features = ["getrandom"] }
cube-argo = { path = "crates/cube-argo" }
cube-proof = { path = "crates/cube-proof" }

[lib]
name = "cube"
path = "src/lib.rs"

[[bin]]
name = "cube"
path = "src/operative/main.rs"
